<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760">
  <rect width="1200" height="760" fill="#f8fafc"/>
  <text x="600" y="42" font-family="Arial,sans-serif" font-size="28" font-weight="bold" text-anchor="middle" fill="#17365d">KIẾN TRÚC HỆ THỐNG QUẢN LÝ PHÒNG KHÁM</text>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#475569"/>
    </marker>
  </defs>

  <g font-family="Arial,sans-serif" text-anchor="middle">
    <rect x="420" y="75" width="360" height="65" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
    <text x="600" y="103" font-size="19" font-weight="bold" fill="#1e3a8a">Người dùng</text>
    <text x="600" y="126" font-size="15" fill="#1e3a8a">Trình duyệt web</text>

    <rect x="420" y="185" width="360" height="75" rx="12" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/>
    <text x="600" y="215" font-size="20" font-weight="bold" fill="#9a3412">Nginx Reverse Proxy</text>
    <text x="600" y="240" font-size="15" fill="#9a3412">HTTP :8082 • HTTPS :8443</text>

    <rect x="420" y="315" width="360" height="75" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
    <text x="600" y="345" font-size="20" font-weight="bold" fill="#166534">Django / Gunicorn</text>
    <text x="600" y="370" font-size="15" fill="#166534">Ứng dụng quản lý phòng khám</text>

    <rect x="420" y="445" width="360" height="75" rx="12" fill="#f3e8ff" stroke="#9333ea" stroke-width="2"/>
    <text x="600" y="475" font-size="20" font-weight="bold" fill="#6b21a8">PostgreSQL</text>
    <text x="600" y="500" font-size="15" fill="#6b21a8">Cơ sở dữ liệu nghiệp vụ</text>

    <rect x="55" y="590" width="320" height="105" rx="12" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
    <text x="215" y="622" font-size="19" font-weight="bold" fill="#075985">Prometheus</text>
    <text x="215" y="648" font-size="15" fill="#075985">Thu thập metrics</text>
    <text x="215" y="672" font-size="15" fill="#075985">Grafana :3001</text>

    <rect x="440" y="590" width="320" height="105" rx="12" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
    <text x="600" y="622" font-size="19" font-weight="bold" fill="#92400e">Promtail</text>
    <text x="600" y="648" font-size="15" fill="#92400e">Thu thập log Docker</text>
    <text x="600" y="672" font-size="15" fill="#92400e">Chuyển log tới Loki</text>

    <rect x="825" y="590" width="320" height="105" rx="12" fill="#fce7f3" stroke="#db2777" stroke-width="2"/>
    <text x="985" y="622" font-size="19" font-weight="bold" fill="#9d174d">Loki</text>
    <text x="985" y="648" font-size="15" fill="#9d174d">Lưu trữ và truy vấn log</text>
    <text x="985" y="672" font-size="15" fill="#9d174d">Grafana Explore / LogQL</text>
  </g>

  <g fill="none" stroke="#475569" stroke-width="2.5" marker-end="url(#arrow)">
    <path d="M600 140 V185"/>
    <path d="M600 260 V315"/>
    <path d="M600 390 V445"/>
    <path d="M420 350 H215 V590"/>
    <path d="M780 350 H985 V590"/>
    <path d="M760 642 H825"/>
  </g>

  <text x="600" y="730" font-family="Arial,sans-serif" font-size="14" text-anchor="middle" fill="#475569">Sơ đồ khái quát các thành phần; cần đối chiếu với cấu hình triển khai thực tế trước khi nộp.</text>
</svg>
