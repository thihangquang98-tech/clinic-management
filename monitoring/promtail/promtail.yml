server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: docker
    pipeline_stages:
      - docker: {}
      - drop:
          older_than: 1h
          drop_counter_reason: too_old
    static_configs:
      - targets:
          - localhost
        labels:
          job: docker
          host: clinic-management
          __path__: /var/lib/docker/containers/*/*-json.log
